[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["venv", ".venv", "migrations"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "C90",  # mccabe complexity
]
ignore = [
    "E501",  # line too long — handled by formatter
    "B008",  # do not perform function call in argument defaults (FastAPI Depends)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B018", "F841", "C901"]  # allow useless expressions, unused vars, and complex test helpers

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
