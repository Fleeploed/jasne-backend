name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# Cancel in-progress runs when a new commit lands on the same ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------
  # 1. Lint — fast (fails the whole pipeline if style is broken)
  # ----------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ruff
        run: pip install ruff
      - name: Check style
        run: |
          ruff check app tests
          ruff format --check app tests

  # ----------------------------------------------------------------
  # 2. Test — runs pytest with coverage on 3.11 and 3.12
  # ----------------------------------------------------------------
  test:
    name: Test (Python ${{ matrix.python-version }})
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run tests with coverage
        run: pytest --cov=app --cov-report=xml --cov-report=term-missing
      - name: Upload coverage artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  # ----------------------------------------------------------------
  # 3. Build Docker image and push to GHCR (only on main/develop push)
  # ----------------------------------------------------------------
  build:
    name: Build & Push Docker
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
      image-digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build & push image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ----------------------------------------------------------------
  # 4. Verify STAGING on Render (Render auto-deploys from the connected repo)
  # ----------------------------------------------------------------
  verify-staging:
    name: Verify Render Staging
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.RENDER_STAGING_URL || 'https://jasne-backend.onrender.com' }}
    steps:
      - uses: actions/checkout@v6

      - name: Wait for /version to report the new SHA (max 10 min)
        # Render deploys independently after a GitHub push. Polling /version
        # until the SHA flips proves the new build is live before smoke tests.
        env:
          BASE_URL: ${{ vars.RENDER_STAGING_URL || 'https://jasne-backend.onrender.com' }}
        run: |
          URL="${BASE_URL}/version"
          EXPECTED="${GITHUB_SHA:0:7}"
          echo "Polling $URL for git_sha_short=$EXPECTED ..."
          for i in $(seq 1 60); do
            body=$(curl -s --max-time 5 "$URL" || echo "")
            actual=$(echo "$body" | python3 -c "import json,sys; print(json.loads(sys.stdin.read() or '{}').get('git_sha_short',''))" 2>/dev/null || echo "")
            if [ "$actual" = "$EXPECTED" ]; then
              echo "✓ New build live after $((i * 10))s (sha=$actual)"
              exit 0
            fi
            echo "  attempt $i/60 → sha=$actual (want $EXPECTED), retrying in 10s"
            sleep 10
          done
          echo "✗ Rollout timeout — /version never reported $EXPECTED in 10 min"
          exit 1

      - name: Smoke test
        env:
          BASE_URL: ${{ vars.RENDER_STAGING_URL || 'https://jasne-backend.onrender.com' }}
        run: ./scripts/smoke_test.sh "$BASE_URL"

  # ----------------------------------------------------------------
  # 5. Verify PRODUCTION on Render (main only, manual approval via GitHub env)
  #
  # Disabled until a separate Render production service is set up.
  # To re-enable: create RENDER_PRODUCTION_URL variable in the `production`
  # GitHub environment, then change
  # `if:` below back to:  github.event_name == 'push' && github.ref == 'refs/heads/main'
  # ----------------------------------------------------------------
  verify-production:
    name: Verify Render Production
    needs: verify-staging
    if: false  # TODO: enable when production Render service is ready
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.RENDER_PRODUCTION_URL }}
    steps:
      - uses: actions/checkout@v6

      - name: Wait for /version to report the new SHA (max 10 min)
        env:
          BASE_URL: ${{ vars.RENDER_PRODUCTION_URL }}
        run: |
          URL="${BASE_URL}/version"
          EXPECTED="${GITHUB_SHA:0:7}"
          echo "Polling $URL for git_sha_short=$EXPECTED ..."
          for i in $(seq 1 60); do
            body=$(curl -s --max-time 5 "$URL" || echo "")
            actual=$(echo "$body" | python3 -c "import json,sys; print(json.loads(sys.stdin.read() or '{}').get('git_sha_short',''))" 2>/dev/null || echo "")
            if [ "$actual" = "$EXPECTED" ]; then
              echo "✓ New build live after $((i * 10))s (sha=$actual)"
              exit 0
            fi
            echo "  attempt $i/60 → sha=$actual (want $EXPECTED), retrying in 10s"
            sleep 10
          done
          echo "✗ Rollout timeout — /version never reported $EXPECTED in 10 min"
          exit 1

      - name: Smoke test
        env:
          BASE_URL: ${{ vars.RENDER_PRODUCTION_URL }}
        run: ./scripts/smoke_test.sh "$BASE_URL"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: deploy-${{ github.run_number }}
          name: "Deploy #${{ github.run_number }}"
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}
