name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# Cancel in-progress runs when a new commit lands on the same ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------
  # 1. Lint — fast (fails the whole pipeline if style is broken)
  # ----------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ruff
        run: pip install ruff
      - name: Check style
        run: |
          ruff check app tests
          ruff format --check app tests

  # ----------------------------------------------------------------
  # 2. Test — runs pytest with coverage on 3.11 and 3.12
  # ----------------------------------------------------------------
  test:
    name: Test (Python ${{ matrix.python-version }})
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run tests with coverage
        run: pytest --cov=app --cov-report=xml --cov-report=term-missing
      - name: Upload coverage artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  # ----------------------------------------------------------------
  # 3. Build Docker image and push to GHCR (only on main/develop push)
  # ----------------------------------------------------------------
  build:
    name: Build & Push Docker
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
      image-digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build & push image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ----------------------------------------------------------------
  # 4. Deploy to STAGING (auto on push to develop OR main)
  # ----------------------------------------------------------------
  deploy-staging:
    name: Deploy → Staging
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway (staging)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}
        # Project: jasne-backend-staging, env: production (Railway default), service: jasne-backend
        run: railway up --service jasne-backend --environment production --detach

      - name: Wait for /health to return 200 (max 5 min)
        run: |
          URL="${{ vars.STAGING_URL }}/health"
          echo "Polling $URL ..."
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 "$URL" || echo "000")
            if [ "$code" = "200" ]; then
              echo "✓ Healthy after $((i * 10))s"
              exit 0
            fi
            echo "  attempt $i/30 → HTTP $code, retrying in 10s"
            sleep 10
          done
          echo "✗ Health check timeout — service did not become healthy in 5 min"
          exit 1

      - name: Smoke test
        run: ./scripts/smoke_test.sh ${{ vars.STAGING_URL }}

  # ----------------------------------------------------------------
  # 5. Deploy to PRODUCTION (main only, manual approval via GitHub env)
  #
  # Disabled until a separate Railway production project is set up.
  # To re-enable: create RAILWAY_TOKEN_PRODUCTION secret + PRODUCTION_URL
  # variable in the `production` GitHub environment, then change
  # `if:` below back to:  github.event_name == 'push' && github.ref == 'refs/heads/main'
  # ----------------------------------------------------------------
  deploy-production:
    name: Deploy → Production
    needs: deploy-staging
    if: false  # TODO: enable when production Railway project + token are ready
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway (production)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_PRODUCTION }}
        run: railway up --service jasne-backend --environment production --detach

      - name: Wait for /health to return 200 (max 5 min)
        run: |
          URL="${{ vars.PRODUCTION_URL }}/health"
          echo "Polling $URL ..."
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 "$URL" || echo "000")
            if [ "$code" = "200" ]; then
              echo "✓ Healthy after $((i * 10))s"
              exit 0
            fi
            echo "  attempt $i/30 → HTTP $code, retrying in 10s"
            sleep 10
          done
          echo "✗ Health check timeout — service did not become healthy in 5 min"
          exit 1

      - name: Smoke test
        run: ./scripts/smoke_test.sh ${{ vars.PRODUCTION_URL }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: deploy-${{ github.run_number }}
          name: "Deploy #${{ github.run_number }}"
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}
