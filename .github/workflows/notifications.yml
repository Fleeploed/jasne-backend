name: Deadline Notifications

on:
  schedule:
    # Daily morning send for Czech users (7:00 UTC = 8/9:00 Prague).
    # Delivery is idempotent on the backend.
    - cron: "0 7 * * *"
    # Receipts check ~45 min later: Expo produces receipts within ~15 min,
    # and DeviceNotRegistered often appears only in the receipt — dead tokens
    # must be disabled or every later send wastes money on them.
    - cron: "45 7 * * *"
  workflow_dispatch:

concurrency:
  group: deadline-notifications
  cancel-in-progress: false

jobs:
  due-reminders:
    name: POST /internal/notifications/due
    # Manual dispatch runs the send job; the 7:45 schedule is receipts-only.
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 7 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Warm up service
        env:
          BASE_URL: ${{ vars.NOTIFICATION_CRON_BASE_URL || vars.STAGING_API_URL }}
        # Warm-up probe before the real request; harmless no-op on providers that don't sleep.
        # Hit /health first with a generous timeout so the POST below lands warm.
        run: |
          set -uo pipefail
          URL="${BASE_URL%/}/health"
          for attempt in 1 2 3; do
            code=$(curl -s -o /dev/null -m 90 -w "%{http_code}" "$URL" || echo "000")
            echo "Wake attempt $attempt: HTTP $code"
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "::warning::Service did not respond OK after 3 wake attempts; continuing anyway"

      - name: Trigger backend notification job
        env:
          BASE_URL: ${{ vars.NOTIFICATION_CRON_BASE_URL || vars.STAGING_API_URL }}
          CRON_SECRET: ${{ secrets.INTERNAL_CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Missing GitHub secret INTERNAL_CRON_SECRET"
            exit 1
          fi

          URL="${BASE_URL%/}/internal/notifications/due"
          response=$(curl -s -m 120 -w "\n%{http_code}\n%{time_total}" \
            -X POST \
            -H "X-Cron-Secret: $CRON_SECRET" \
            -H "Content-Type: application/json" \
            "$URL" || echo "")

          if [ -z "$response" ]; then
            echo "::error::No response from $URL"
            exit 1
          fi

          time_total=$(echo "$response" | tail -n 1)
          code=$(echo "$response" | tail -n 2 | head -n 1)
          body=$(echo "$response" | head -n -2)

          echo "URL: $URL"
          echo "HTTP $code (${time_total}s)"
          echo "Body: $body"

          if [ "$code" != "200" ]; then
            echo "::error::Notification job returned HTTP $code"
            exit 1
          fi

  push-receipts:
    name: POST /internal/notifications/receipts
    # Runs on the 7:45 schedule and on manual dispatch (after the send job).
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '45 7 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Warm up service
        env:
          BASE_URL: ${{ vars.NOTIFICATION_CRON_BASE_URL || vars.STAGING_API_URL }}
        run: |
          set -uo pipefail
          URL="${BASE_URL%/}/health"
          for attempt in 1 2 3; do
            code=$(curl -s -o /dev/null -m 90 -w "%{http_code}" "$URL" || echo "000")
            echo "Wake attempt $attempt: HTTP $code"
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "::warning::Service did not respond OK after 3 wake attempts; continuing anyway"

      - name: Trigger backend receipts job
        env:
          BASE_URL: ${{ vars.NOTIFICATION_CRON_BASE_URL || vars.STAGING_API_URL }}
          CRON_SECRET: ${{ secrets.INTERNAL_CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Missing GitHub secret INTERNAL_CRON_SECRET"
            exit 1
          fi

          URL="${BASE_URL%/}/internal/notifications/receipts"
          response=$(curl -s -m 120 -w "\n%{http_code}\n%{time_total}" \
            -X POST \
            -H "X-Cron-Secret: $CRON_SECRET" \
            -H "Content-Type: application/json" \
            "$URL" || echo "")

          if [ -z "$response" ]; then
            echo "::error::No response from $URL"
            exit 1
          fi

          time_total=$(echo "$response" | tail -n 1)
          code=$(echo "$response" | tail -n 2 | head -n 1)
          body=$(echo "$response" | head -n -2)

          echo "URL: $URL"
          echo "HTTP $code (${time_total}s)"
          echo "Body: $body"

          if [ "$code" != "200" ]; then
            echo "::error::Receipts job returned HTTP $code"
            exit 1
          fi
