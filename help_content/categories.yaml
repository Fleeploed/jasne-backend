      title: "Визы и проживание"
      subtitle: "МВД Чехии, разрешения, практические советы"
      hero_title: "Проживание в Чехии"
      hero_text: "Практические гайды по проживанию в Чехии: проверка статуса заявления, продление разрешения и другие документы."
    uk:
      title: "Візи та проживання"
      subtitle: "МВС Чехії, дозволи, практичні поради"
      hero_title: "Проживання в Чехії"
      hero_text: "Практичні інструкції щодо проживання в Чехії: перевірка статусу заяви, продовження дозволу та інші документи."
    en:
      title: "Visas & living"
      subtitle: "Interior Ministry, permits, practical tips"
      hero_title: "Staying in Czechia"
      hero_text: "Practical guides for staying in Czechia: checking application status, extending residence permits, and handling related documents."
  fallback:
    cs:
      title: "Zatím prázdné"
      text: "Návody k OAMP a pobytu připravujeme."
    ru:
      title: "Раздел в работе"
      text: "Гайды по визе и pobyt мы добавим в ближайшее время."
    uk:
      title: "Розділ у роботі"
      text: "Інструкції щодо візи та pobyt ми додамо найближчим часом."
    en:
      title: "Section in progress"
      text: "Guides for visas and residence will be added soon."
  useful_actions:
    - key: scan_oamp_letter
      action: scan_new
      highlighted: true
    - key: add_deadline_manual
      action: deadline_new
      highlighted: false
    - key: open_deadlines
      action: deadlines_tab
      highlighted: false

