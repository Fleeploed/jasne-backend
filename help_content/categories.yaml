  translations:
    cs:
      title: "Víza a pobyt"
      subtitle: "Ministerstvo vnitra, povolení, praktické tipy"
      hero_title: "Pobyt v Česku"
      hero_text: "Praktické návody k pobytu v Česku: kontrola stavu řízení, prodloužení pobytu a další povolení."
