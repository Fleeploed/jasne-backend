# Help categories — ordered list. Position here = display order in mobile UI.
# Each category needs at minimum a `cs` translation and `cs` fallback.
# `ru`, `uk`, and `en` are provided alongside `cs` so the Help tab can stay
# in the user's selected language.

- slug: visa-pobyt
  icon: passport
  guides_order:
    - check-status
