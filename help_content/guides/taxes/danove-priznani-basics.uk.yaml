    title: "Хто зазвичай подає"
    body: "OSVČ подає податкову декларацію щороку. Працівник з одним роботодавцем часто її не подає, якщо роботодавець робить річний розрахунок. Якщо у вас є додаткові доходи, перевірте обов'язок подання в податковій або у податкового консультанта."

