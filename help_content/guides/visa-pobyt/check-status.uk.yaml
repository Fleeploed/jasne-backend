slug: check-status
category: visa-pobyt
language: uk
published: true
title: "Як перевірити статус заяви (OAMP)"
subtitle: "Статус справи щодо pobyt"
short_summary: "Де знайти номер заяви, як відкрити онлайн-перевірку статусу і що робити, якщо статус довго не змінюється."
keywords:
  - OAMP
  - pobyt
  - статус заяви
  - výzva
  - řízení
  - дозвіл
official_source_url: "https://frs.gov.cz/informace-o-stavu-rizeni"
sections:
  - type: text
    title: "Коротко"
    body: "OAMP (Відділ з питань притулку та міграційної політики) є частиною Міністерства внутрішніх справ Чехії та розглядає заяви щодо pobyt. Після подання заяви статус можна перевірити онлайн за číslo jednací. Перевірка безкоштовна й доступна будь-коли."

  - type: steps
    title: "Що зробити"
    items:
      - "Знайдіть номер заяви. Він зазвичай є на підтвердженні подання або на документі щодо візи чи біометрії."
      - "Відкрийте frs.gov.cz і розділ Інформація про статус справи."
      - "Введіть номер у форматі OAM-XXXXX-XX/AA-YYYY і дату народження."
      - "Прочитайте поточний статус: Прийнято, У розгляді, Призупинено, Рішення ухвалено або Доставлено."

  - type: checklist
    title: "Що підготувати"
    items:
      - "Паспорт"
      - "Номер заяви або číslo jednací"
      - "Доступ до інтернету"

  - type: text
    title: "Що означають статуси"
    body: "Прийнято означає, що заяву прийняли. У розгляді означає, що її обробляють. Призупинено зазвичай означає, що установа чекає на додаткові документи. Рішення ухвалено означає, що рішення вже існує. Доставлено означає, що рішення доставлено або готове до отримання."

  - type: warning
    title: "Важливо"
    body: "Jasně не підключається до державних систем і не може перевірити статус замість вас. Ми показуємо, де перевірити статус і як прочитати результат. Усі офіційні заяви та рішення залишаються на стороні OAMP."

  - type: text
    title: "Якщо статус довго не змінюється"
    body: "Типові строки залежать від типу заяви. Якщо статус довго не змінюється або ви отримали výzva для доповнення документів, перевірте термін і дійте за листом. У складних випадках варто проконсультуватися з фахівцем з міграційного права."

  - type: cta
    title: "Що далі"
    actions:
      - scan_oamp_letter
      - add_deadline_manual
      - open_deadlines
