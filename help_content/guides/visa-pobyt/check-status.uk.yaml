slug: check-status
category: visa-pobyt
language: uk
published: true
title: "Як перевірити статус заяви (OAMP)"
subtitle: "Статус заяви на проживання або візу"
short_summary: "Де знайти номер справи, як перевірити статус онлайн і що робити, якщо статус довго не змінюється."
keywords:
  - OAMP
  - pobyt
  - статус заяви
  - výzva
  - řízení
  - дозвіл
official_source_url: "https://ipc.gov.cz/informace-o-stavu-rizeni/"
sections:
  - type: text
    title: "Коротко"
    body: "OAMP (Відділ з питань притулку та міграційної політики) є частиною Міністерства внутрішніх справ Чехії та розглядає заяви щодо проживання і віз. Після подання заяви статус можна перевірити онлайн за номером справи з листа OAMP. Перевірка безкоштовна й доступна будь-коли."

  - type: steps
    title: "Що зробити"
    items:
      - "Знайдіть номер справи. Зазвичай він є на підтвердженні подання або в листі від OAMP."
      - "Відкрийте перевірку статусу в Jasně або офіційну сторінку IPC."
      - "Введіть номер у форматі OAM-XXXXX-XX/AA-YYYY. Частина –XX може бути відсутня."
      - "Прочитайте статус: схвалено, в обробці, не знайдено або відмовлено/закрито."

  - type: checklist
    title: "Що підготувати"
    items:
      - "Паспорт"
      - "Номер справи з листа OAMP"
      - "Доступ до інтернету"

  - type: text
    title: "Що означають статуси"
    body: "Попередньо оцінено позитивно — заяву схвалено для наступного кроку. В обробці — OAMP ще розглядає справу. Не знайдено — номер не відображається в онлайн-системі. Відмовлено або закрито — заяву відхилено або провадження завершено."

  - type: warning
    title: "Важливо"
    body: "Jasně перевіряє публічну форму IPC і показує результат вашою мовою. Результат має інформаційний характер; юридично обов'язкове рішення все одно надходить від OAMP листом або іншим офіційним повідомленням."

  - type: text
    title: "Якщо статус довго не змінюється"
    body: "Типові строки залежать від типу заяви. Якщо статус довго не змінюється або ви отримали лист із вимогою донести документи, перевірте термін і дійте за листом. У складних випадках варто проконсультуватися з фахівцем з міграційного права."

  - type: cta
    title: "Що далі"
    actions:
      - check_status_visa
      - scan_oamp_letter
      - open_deadlines
