slug: check-status
category: visa-pobyt
language: ru
published: true
title: "Как проверить статус заявления (OAMP)"
subtitle: "Статус заявления на ВНЖ или визу"
short_summary: "Пошагово: где найти номер дела, как проверить статус онлайн и что делать, если статус долго не меняется."
keywords:
  - OAMP
  - pobyt
  - stav řízení
  - výzva
  - řízení
  - povolení
official_source_url: "https://ipc.gov.cz/informace-o-stavu-rizeni/"
sections:
  - type: text
    title: "Коротко"
    body: "OAMP (Odbor azylové a migrační politiky) — отдел МВД Чехии, который занимается заявлениями на ВНЖ и визы. После подачи заявления статус можно проверить онлайн по номеру дела из письма OAMP. Проверка бесплатная и доступна в любое время."

  - type: steps
    title: "Что сделать"
    items:
      - "Найдите номер дела. Обычно он указан в подтверждении подачи или в письме от OAMP."
      - "Откройте проверку статуса в Jasně или официальную страницу IPC."
      - "Введите номер в формате OAM-XXXXX-XX/AA-YYYY. Часть –XX может отсутствовать."
      - "Прочитайте статус: одобрено, в обработке, не найдено или отказано/закрыто."

  - type: checklist
    title: "Что подготовить"
    items:
      - "Паспорт"
      - "Номер дела из письма OAMP"
      - "Доступ к интернету"

  - type: text
    title: "Что значит каждый статус"
    body: "Предварительно оценено положительно — заявление одобрено для следующего шага. В обработке — OAMP ещё рассматривает дело. Не найдено — номер не отображается в онлайн-системе. Отказано или закрыто — заявление отклонено либо производство завершено."

  - type: warning
    title: "Важно"
    body: "Jasně проверяет публичную форму IPC и показывает результат на вашем языке. Результат носит информационный характер; юридически обязательное решение всё равно приходит от OAMP письмом или другим официальным уведомлением."

  - type: text
    title: "Если статус не меняется долго"
    body: "Типичные сроки зависят от типа заявления. Если статус долго не меняется или пришло письмо с требованием донести документы, проверьте срок и действуйте по письму. В сложных случаях лучше обратиться к специалисту по миграционному праву."

  - type: cta
    title: "Что дальше"
