slug: check-status
category: visa-pobyt
language: ru
published: true
title: "Как проверить статус заявления (OAMP)"
subtitle: "Stav řízení — узнать, что с pobyt"
short_summary: "Пошагово: где найти номер заявления, как открыть stav řízení онлайн, что делать, если статус не двигается."
keywords:
  - OAMP
  - pobyt
  - stav řízení
  - výzva
  - řízení
  - povolení
official_source_url: "https://frs.gov.cz/informace-o-stavu-rizeni"
sections:
  - type: text
    title: "Коротко"
    body: "OAMP (Odbor azylové a migrační politiky) — это отдел МВД ЧР, который занимается заявлениями на pobyt. После подачи заявления статус процесса можно проверить онлайн по номеру дела. Это бесплатно и доступно круглосуточно."

  - type: steps
    title: "Что сделать"
    items:
      - "Найдите номер заявления — он указан в подтверждении подачи (potvrzení o podání žádosti) или на выданной vstupní vízum/biometrii заявке."
      - "Откройте сайт frs.gov.cz → раздел «Informace o stavu řízení» (или прямая ссылка из этой статьи)."
      - "Введите номер дела (формат OAM-XXXXX-XX/AA-YYYY) и дату рождения."
      - "Прочитайте текущий статус: «Přijato», «V řízení», «Přerušeno», «Rozhodnuto», «Doručeno»."

  - type: checklist
    title: "Что подготовить"
    items:
      - "Паспорт (для проверки даты рождения)"
      - "Номер заявления (OAM-...)"
      - "Доступ к интернету"

  - type: text
    title: "Что значит каждый статус"
    body: "Přijato — заявление получено, но ещё не рассматривается. V řízení — рассматривается. Přerušeno — приостановлено (обычно требуется доплнить документы; ждите výzva по почте). Rozhodnuto — решение принято, но ещё не отправлено. Doručeno — решение доставлено или готово к получению на OAMP."

  - type: warning
    title: "Важно"
    body: "Jasně не подключается к государственным системам и не может проверить статус за вас. Мы показываем, где это сделать и как читать результат. Все официальные запросы и решения остаются на стороне OAMP."

  - type: text
    title: "Если статус не меняется долго"
    body: "Типичные сроки: 60-180 дней. Если прошло больше 60 дней без движения — можно подать žádost o vydání rozhodnutí (запрос на ускорение) или обратиться к адвокату по миграционному праву. На OAMP не звоните — телефоны не работают для частных запросов."

