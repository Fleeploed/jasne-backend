slug: check-status
category: visa-pobyt
language: cs
published: true
title: "Jak zkontrolovat stav žádosti (OAMP)"
subtitle: "Stav řízení u pobytu"
short_summary: "Kde najít číslo žádosti, jak otevřít online kontrolu stavu řízení a co dělat, když se stav dlouho nemění."
keywords:
  - OAMP
  - pobyt
  - stav řízení
  - výzva
  - řízení
  - povolení
official_source_url: "https://ipc.gov.cz/informace-o-stavu-rizeni/"
sections:
  - type: text
    title: "Stručně"
    body: "OAMP (Odbor azylové a migrační politiky) je část Ministerstva vnitra ČR, která řeší žádosti o pobyt. Po podání žádosti si stav řízení můžete ověřit online podle čísla jednacího. Kontrola je zdarma a dostupná kdykoliv."

  - type: steps
    title: "Co udělat"
    items:
      - "Najděte číslo jednací. Bývá na potvrzení o podání žádosti nebo v dopise od OAMP."
      - "Otevřete kontrolu stavu v Jasně nebo oficiální stránku IPC."
      - "Zadejte číslo ve formátu OAM-XXXXX-XX/AA-YYYY. Část –XX může chybět."
      - "Přečtěte aktuální stav: schváleno, probíhá, nenalezeno nebo zamítnuto/ukončeno."

  - type: checklist
    title: "Co si připravit"
    items:
      - "Pas"
      - "Číslo žádosti nebo číslo jednací"
      - "Přístup k internetu"

  - type: text
    title: "Co znamenají stavy"
    body: "Předběžně vyhodnoceno kladně znamená, že žádost byla schválena pro další krok. Zpracovává se znamená, že OAMP věc stále posuzuje. Nenalezeno znamená, že číslo není vidět v online systému. Zamítnuto nebo ukončeno znamená, že žádost byla odmítnuta nebo řízení skončilo."

  - type: warning
    title: "Důležité"
    body: "Jasně kontroluje veřejný formulář IPC a zobrazí výsledek ve vašem jazyce. Výsledek je pouze informativní; závazné rozhodnutí pořád přichází od OAMP dopisem nebo jiným oficiálním sdělením."

  - type: text
    title: "Když se stav dlouho nemění"
    body: "Typické lhůty se liší podle typu žádosti. Pokud se stav dlouho nemění nebo máte výzvu k doplnění dokumentů, zkontrolujte termín a postupujte podle dopisu. U složitých případů zvažte konzultaci s odborníkem na migrační právo."

  - type: cta
    title: "Co dál"
    actions:
      - check_status_visa
      - scan_oamp_letter
      - open_deadlines
