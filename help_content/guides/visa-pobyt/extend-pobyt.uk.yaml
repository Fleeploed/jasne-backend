    title: "Коли подавати заяву"
    body: "Заяву на продовження pobyt зазвичай подають не раніше ніж за 120 днів і не пізніше ніж за 14 днів до кінця чинного дозволу. Подати в останній момент можливо, але це ризиковано: якщо бракує додатку, може залишитися мало часу на виправлення."

