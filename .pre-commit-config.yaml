repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Запускает pytest на ИЗМЕНЁННЫХ тестах перед коммитом
  - repo: local
    hooks:
      - id: pytest-check
        name: pytest
        entry: venv/bin/pytest -x -q --ff
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-commit]
