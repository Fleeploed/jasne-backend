[pytest]
asyncio_mode = auto
testpaths = tests
pythonpath = .
filterwarnings =
    ignore::DeprecationWarning
env =
    OPENAI_API_KEY=test-key
    SUPABASE_URL=https://test.supabase.co
    SUPABASE_SERVICE_KEY=test-service-key
    SUPABASE_JWT_SECRET=test-jwt-secret-must-be-long-enough-for-hs256
    ENVIRONMENT=test
    LOG_LEVEL=WARNING
